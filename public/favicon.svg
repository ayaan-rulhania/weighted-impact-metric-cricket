    <!-- Splice line -->
    <path fill="none" stroke="#7A5C38" stroke-width="0.48" stroke-linecap="round" d="M -1.88 -2.42 Q 0 -1.9 1.88 -2.42"/>
    <!-- Straight grain (face) -->
