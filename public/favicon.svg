    <path fill="none" stroke="#9E7B4A" stroke-width="0.28" stroke-linecap="round" opacity="0.4" d="M -4.15 4.35 Q -1.6 5.85 0 5.65 Q 1.6 5.85 4.15 4.35 M -4.85 8.05 Q -2 9.55 0 9.28 Q 2 9.55 4.85 8.05 M -4.35 11.35 Q -1.75 12.45 0 12.22 Q 1.75 12.45 4.35 11.35"/>
