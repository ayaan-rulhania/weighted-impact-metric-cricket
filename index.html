<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weighted Impact Metric for Cricket</title>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            overflow: hidden;
            margin: 0;
        }

        h1 {
            background: linear-gradient(90deg, #fc5c7d, #6a82fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s ease infinite;
            text-align: center;
            margin: 20px;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .pong {
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .paddle {
            position: absolute;
            width: 15px;
            height: 100px;
            background: black;
        }

        .ball {
            position: absolute;
            width: 15px;
            height: 15px;
            background: red;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <h1>Cricket Impact Metric with AI Pong Game</h1>
    <div class="pong">
        <div class="paddle" id="player"></div>
        <div class="paddle" id="ai"></div>
        <div class="ball" id="ball"></div>
    </div>

    <script>
        const player = document.getElementById('player');
        const ai = document.getElementById('ai');
        const ball = document.getElementById('ball');

        let playerY = 200;
        let aiY = 200;
        let ballX = 100;
        let ballY = 100;
        let ballSpeedX = 2;
        let ballSpeedY = 2;

        function movePlayer(e) {
            const pongArea = document.querySelector('.pong');
            if (e.key === 'ArrowUp' && playerY > 0) {
                playerY -= 20;
            } else if (e.key === 'ArrowDown' && playerY < pongArea.clientHeight - 100) {
                playerY += 20;
            }
            player.style.top = playerY + 'px';
        }

        function aiMovement() {
            if (ballY < aiY + 50) {
                aiY -= 2;
            } else if (ballY > aiY + 50) {
                aiY += 2;
            }
            ai.style.top = aiY + 'px';
        }

        function moveBall() {
            ballX += ballSpeedX;
            ballY += ballSpeedY;

            if (ballY <= 0 || ballY >= window.innerHeight - 15) {
                ballSpeedY = -ballSpeedY;
            }

            if (ballX <= 15 && ballY >= playerY && ballY <= playerY + 100 ||
                ballX >= window.innerWidth - 30 && ballY >= aiY && ballY <= aiY + 100) {
                ballSpeedX = -ballSpeedX;
            }

            ball.style.left = ballX + 'px';
            ball.style.top = ballY + 'px';
        }

        document.addEventListener('keydown', movePlayer);
        setInterval(() => {
            aiMovement();
            moveBall();
        }, 20);
    </script>
</body>
</html>
