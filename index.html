<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket SVG Animation</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            font-size: 3em;
            background: linear-gradient(270deg, #ff00cc, #3333ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s ease infinite;
        }

        @keyframes gradient {
            0% {background-position: 0%;}
            50% {background-position: 100%;}
            100% {background-position: 0%;}
        }

        #pong {
            display: block;
            margin: 0 auto;
            background: #121212;
        }
    </style>
</head>
<body>
    <h1>SVG Cricket Animation</h1>
    <svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
        <!-- SVG content for cricket animation goes here -->
        <circle cx="400" cy="300" r="50" fill="red" />
        <!-- Additional SVG elements to create animation -->
    </svg>

    <canvas id="pong" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById('pong');
        const context = canvas.getContext('2d');

        // Create the pong game elements
        const paddleWidth = 10;
        const paddleHeight = 100;
        const ballSize = 10;
        let player1Y = 250;
        let player2Y = 250;
        let ballX = 400;
        let ballY = 200;
        let ballSpeedX = 5;
        let ballSpeedY = 5;

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Update game state
        function update() {
            ballX += ballSpeedX;
            ballY += ballSpeedY;

            // Wall collision
            if (ballY <= 0 || ballY >= canvas.height) {
                ballSpeedY = -ballSpeedY;
            }

            // Paddle collision
            if (ballX <= paddleWidth && ballY >= player1Y && ballY <= player1Y + paddleHeight) {
                ballSpeedX = -ballSpeedX;
            } else if (ballX >= canvas.width - paddleWidth && ballY >= player2Y && ballY <= player2Y + paddleHeight) {
                ballSpeedX = -ballSpeedX;
            }

            // Reset ball if it goes off screen
            if (ballX < 0 || ballX > canvas.width) {
                ballX = canvas.width / 2;
                ballY = canvas.height / 2;
                ballSpeedX = -ballSpeedX;
            }
        }

        // Draw everything
        function draw() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.fillStyle = 'white';
            context.fillRect(0, player1Y, paddleWidth, paddleHeight);
            context.fillRect(canvas.width - paddleWidth, player2Y, paddleWidth, paddleHeight);
            context.fillStyle = 'red';
            context.beginPath();
            context.arc(ballX, ballY, ballSize, 0, Math.PI * 2, false);
            context.fill();
        }

        // Mouse movement
        canvas.addEventListener('mousemove', (event) => {
            const mouseY = event.clientY - canvas.getBoundingClientRect().top;
            player1Y = mouseY - paddleHeight / 2;
            // Constrain the paddle
            if (player1Y < 0) player1Y = 0;
            if (player1Y > canvas.height - paddleHeight) player1Y = canvas.height - paddleHeight;
        });

        gameLoop(); // Start the game loop
    </script>
</body>
</html>
