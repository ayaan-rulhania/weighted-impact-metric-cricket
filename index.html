<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket Bat — Masterpiece</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at 50% 30%, #1a1208 0%, #0a0804 60%, #000000 100%);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    svg#bat {
      filter: drop-shadow(0 0 80px rgba(210,160,60,0.45)) drop-shadow(0 0 200px rgba(180,120,20,0.18));
      animation: float 5s ease-in-out infinite;
      max-height: 98vh;
    }
    @keyframes float {
      0%   { transform: translateY(0px) rotate(-1deg); }
      50%  { transform: translateY(-18px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(-1deg); }
    }
  </style>
</head>
<body>

     viewBox="0 0 520 1100" width="340">

         GRADIENTS
    ═══════════════════════════════════════════════ -->

      <stop offset="14%"  stop-color="#c17f3a"/>
      <stop offset="22%"  stop-color="#e8b465"/>

      <stop offset="38%"  stop-color="#fce9b2"/>

      <stop offset="50%"  stop-color="#fef5d8"/>
      <stop offset="54%"  stop-color="#fce9b2"/>
      <stop offset="62%"  stop-color="#f5d28a"/>

      <stop offset="78%"  stop-color="#c17f3a"/>
      <stop offset="86%"  stop-color="#8a4e1a"/>
      <stop offset="94%"  stop-color="#5a2e08"/>
      <stop offset="100%" stop-color="#2d1204"/>
    </linearGradient>

      <stop offset="0%"   stop-color="#2a1205"/>
      <stop offset="40%"  stop-color="#7a4420"/>
      <stop offset="60%"  stop-color="#9e5c28"/>
      <stop offset="100%" stop-color="#3c1a08"/>
    </linearGradient>

      <stop offset="18%"  stop-color="#2c1608"/>

      <stop offset="50%"  stop-color="#5a3018"/>
      <stop offset="65%"  stop-color="#3f2010"/>
      <stop offset="82%"  stop-color="#2c1608"/>
      <stop offset="100%" stop-color="#1a0e05"/>
    </linearGradient>

    <!-- Grip wrap gradient (dark leather) -->
    <linearGradient id="gripGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d0604"/>
      <stop offset="20%"  stop-color="#1e110a"/>
      <stop offset="40%"  stop-color="#2a180e"/>
      <stop offset="50%"  stop-color="#351e12"/>
      <stop offset="60%"  stop-color="#2a180e"/>
      <stop offset="80%"  stop-color="#1e110a"/>
      <stop offset="100%" stop-color="#0d0604"/>

      <stop offset="0%"   stop-color="#3a1e08"/>

      <stop offset="30%"  stop-color="#d4a830"/>
      <stop offset="50%"  stop-color="#f5d060"/>
      <stop offset="70%"  stop-color="#d4a830"/>

      <stop offset="30%"  stop-color="#8c2020"/>
      <stop offset="50%"  stop-color="#c03030"/>
      <stop offset="70%"  stop-color="#8c2020"/>

      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>

      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

      <stop offset="0%"   stop-color="rgba(210,160,60,0.13)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- ═══════════════════════════════════════════════
         FILTERS
    ═══════════════════════════════════════════════ -->

    <!-- Overall bat shadow -->
    <filter id="batShadow" x="-20%" y="-5%" width="140%" height="110%">
      <feDropShadow dx="12" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.85"/>
    </filter>

    <!-- Grain texture filter -->
    <filter id="woodGrain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65 0.015" numOctaves="4" seed="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="soft-light" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Grip texture -->
    <filter id="gripTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.9 0.08" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Soft inner glow for blade face -->
    <filter id="faceGlow" x="-10%" y="-2%" width="120%" height="104%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

         CLIP PATHS

         PATTERNS — wood grain lines
    ═══════════════════════════════════════════════ -->
    <pattern id="grainPattern" x="0" y="0" width="2" height="100" patternUnits="userSpaceOnUse">
      <rect width="0.3" height="100" fill="rgba(0,0,0,0.08)"/>

      <rect x="1.4" width="0.2" height="100" fill="rgba(0,0,0,0.05)"/>
    </pattern>
